name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install pytest hypothesis tiktoken requests

      - name: Install janus-lang in editable mode
        run: |
          pip install -e .

      - name: Check compilation of all 10 examples and stdlib
        run: |
          for f in examples/*.jn; do
            echo "Checking $f..."
            python -m janus.cli check "$f"
          done
          for f in stdlib/*.jn; do
            echo "Checking $f..."
            python -m janus.cli check "$f"
          done

      - name: Run PyTest suite (Regression, Execution, Reference, Audit)
        run: |
          pytest -v

      - name: Verify benchmarks run without error
        run: |
          python benchmarks/tokens.py
          python benchmarks/llm_eval.py --dry-run
